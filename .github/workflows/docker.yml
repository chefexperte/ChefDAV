name: Docker image

# Builds and publishes the frontend-only image to GitHub Container Registry:
#
#   ghcr.io/chefexperte/chefdav:latest    default branch
#   ghcr.io/chefexperte/chefdav:edge      every default-branch push
#   ghcr.io/chefexperte/chefdav:0.3.0     git tag v0.3.0   (+ :0.3)
#   ghcr.io/chefexperte/chefdav:sha-<commit>
#
#   docker run -d -p 8080:80 ghcr.io/chefexperte/chefdav:latest
#
# The image is the static WASM app (Caddy file server); it contains no CalDAV
# server. Every run is smoke-tested (app served, SPA fallback, health) before
# anything is pushed, and PRs build and test without publishing.
#
# The backend is chosen at *runtime* (`-e BACKEND_URL=…`), so one published
# image serves any deployment — nothing about the server is baked in here.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: Build, test and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: GHCR image name (lowercase)
        id: image
        run: echo "name=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Tags + OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # `load: true` keeps the built image on the runner for the smoke tests;
      # no gha cache export (it is not used across runs here, and would grow
      # the package). A cold build is ~2-5 min on a runner.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: chefdav:ci
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test — container serves the app
        run: |
          docker run -d --name chefdav-ci -p 18080:80 chefdav:ci
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:18080/ && break
            if ! docker inspect -f '{{.State.Running}}' chefdav-ci | grep -q true; then
              echo "container exited early"; docker logs chefdav-ci; exit 1
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:18080/healthz

      - name: Smoke test — bundle, SPA fallback, cache headers
        run: |
          pages=$(curl -sf http://127.0.0.1:18080/)
          # The entry document imports the trunk-generated JS glue (relative,
          # "./chef-dav-<hash>.js"). The rancless class keeps this stable across
          # locales — "[a-zA-Z0-9_]" silently matches nothing under a UTF-8
          # collation, which is how an earlier version of this step passed an
          # empty name to curl.
          js=$(printf '%s' "$pages" | grep -oE 'chef-dav[-a-z0-9_]*\.js' | head -1)
          test -n "$js" || { echo "no bundle reference in index.html"; exit 1; }
          curl -sf -o /dev/null "http://127.0.0.1:18080/$js"
          # …which loads the wasm bundle next to it
          wasm=$(printf '%s' "$js" | sed 's/\.js$/_bg.wasm/')
          curl -sf -o /dev/null "http://127.0.0.1:18080/$wasm"
          # the extension is served with the right type (a misrouted file_server
          # answers text/html here and the browser refuses to run it)
          curl -sfI "http://127.0.0.1:18080/$js" | grep -qi 'content-type: text/javascript'
          curl -sfI "http://127.0.0.1:18080/$wasm" | grep -qi 'content-type: application/wasm'
          # deep links fall back to index.html so reloads work
          curl -sf "http://127.0.0.1:18080/week/2026-11-16" | grep -q "$js"
          # hashed assets are immutable, the entry document is revalidated
          curl -sfI "http://127.0.0.1:18080/$wasm" | grep -qi 'cache-control: public, max-age=31536000, immutable'
          curl -sfI http://127.0.0.1:18080/ | grep -qi 'cache-control: no-cache'
          # frontend only: no CalDAV server behind the image — an unknown path
          # is just the SPA, never a proxy response
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/caldav/)" = "200"

      # The backend is a runtime setting: same image, new env var, new config.
      - name: Smoke test — BACKEND_URL at start-up
        run: |
          docker rm -f chefdav-ci >/dev/null
          start_with() {
            docker run -d --name chefdav-ci -p 18080:80 "$@" chefdav:ci >/dev/null
            for i in $(seq 1 30); do
              curl -sf -o /dev/null http://127.0.0.1:18080/healthz && return 0
              sleep 1
            done
            echo "container did not come up"; docker logs chefdav-ci; return 1
          }
          config() { curl -sf http://127.0.0.1:18080/config.json; }

          # a URL locks the server field by default and is never cached
          start_with -e BACKEND_URL=https://dav.example.org
          config | grep -q '"backend_url": "https://dav.example.org"'
          config | grep -q '"lock": true'
          curl -sfI http://127.0.0.1:18080/config.json | grep -qi 'cache-control: no-cache'

          # …the same image can start unlocked
          docker rm -f chefdav-ci >/dev/null
          start_with -e BACKEND_URL=https://other.example -e BACKEND_LOCK=false
          config | grep -q '"backend_url": "https://other.example"'
          config | grep -q '"lock": false'

          # …and with no backend at all: the login screen asks for one
          docker rm -f chefdav-ci >/dev/null
          start_with
          config | grep -q '"backend_url": ""'
          config | grep -q '"lock": false'

      # The setup this image is meant for: a reverse proxy publishes the app
      # under a path (calendar.example.com/ui) while the CalDAV server owns the
      # root. Traefik may or may not strip the prefix; both must work, and a
      # deep link must serve the entry document (not HTML for the JS module).
      - name: Smoke test — mounted under a path prefix
        run: |
          docker rm -f chefdav-ci >/dev/null
          docker run -d --name chefdav-ci -p 18080:80 \
            -e BASE_PATH=/ui -e BACKEND_URL=https://dav.example.org chefdav:ci >/dev/null
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:18080/ui/healthz && break
            sleep 1
          done

          # the app, its config and its bundle answer under the prefix
          curl -sf http://127.0.0.1:18080/ui/config.json | grep -q '"base_path": "/ui"'
          js=$(curl -sf http://127.0.0.1:18080/ui/ | grep -oE 'chef-dav[-a-z0-9_]*\.js' | head -1)
          test -n "$js" || { echo "no bundle reference under /ui"; exit 1; }
          curl -sfI "http://127.0.0.1:18080/ui/$js" | grep -qi 'content-type: text/javascript'

          # deep links: the entry document must carry the <base href> that keeps
          # the bundle's relative URLs correct, or the app never boots
          curl -sf http://127.0.0.1:18080/ui/month/2026-11 | grep -q '<base href="/ui/"'
          curl -sf http://127.0.0.1:18080/ui/month/2026-11 | grep -q "$js"

          # the bare prefix redirects to the app
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/ui)" = "308"

          # …and the same image still answers at the root, so a proxy that
          # strips the prefix also works
          curl -sf -o /dev/null http://127.0.0.1:18080/
          curl -sf http://127.0.0.1:18080/config.json | grep -q '"base_path": "/ui"'

      - name: Smoke test — read-only root filesystem
        run: |
          docker rm -f chefdav-ci >/dev/null
          docker run -d --name chefdav-ci -p 18080:80 --read-only \
            --tmpfs /tmp -e BACKEND_URL=https://dav.example.org chefdav:ci >/dev/null
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:18080/healthz && break
            sleep 1
          done
          curl -sf http://127.0.0.1:18080/config.json | grep -q '"backend_url": "https://dav.example.org"'

      - name: Container logs
        if: always()
        run: docker logs chefdav-ci || true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
