name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Unit tests + WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Unit tests (CalDAV/ICS/recurrence/crypto core)
        run: cargo test -p caldav

      - name: Unit tests (location helpers)
        run: cargo test -p chef-dav --lib

      - name: Type-check the WASM app
        run: cargo check --target wasm32-unknown-unknown

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Production build
        run: trunk build --release

      # The dev/production config must emit root-absolute asset URLs: on a deep
      # link (/month/2026-11) a relative "./x.js" resolves to "/month/x.js", the
      # SPA fallback answers it with index.html, and the app never boots (this
      # broke the smoke suite's "reload stays logged in" check). Only the
      # container image uses relative URLs, with a <base href> written at start.
      - name: Asset URLs are root-absolute
        run: |
          if grep -qE '(src|href)="\./' dist/index.html; then
            echo "dist/index.html uses relative asset URLs (./x.js) — see Trunk.toml"
            grep -oE '(src|href)="\./[^"]*"' dist/index.html | head -5
            exit 1
          fi
          grep -qE '(href|src)="/[^"]*\.(js|css)"' dist/index.html

  e2e:
    name: End-to-end (Radicale + Caddy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Start Radicale + CORS proxy
        run: docker compose -f docker/docker-compose.yml up -d

      - name: Wait for CalDAV and create a calendar
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -u alice:secret -X PROPFIND -H "Depth: 0" http://127.0.0.1:8080/ || true)
            if [ "$code" = "207" ]; then break; fi
            sleep 2
          done
          curl -sf -u alice:secret -X MKCALENDAR \
            --data '<?xml version="1.0"?><D:mkcalendar xmlns:D="DAV:" xmlns:C="urn:ietf:params:xml:ns:caldav"><D:set><D:prop><D:resourcetype><D:collection/><C:calendar/></D:resourcetype><D:displayname>Personal</D:displayname></D:prop></D:set></D:mkcalendar>' \
            http://127.0.0.1:8080/alice/personal/

      - name: Seed the demo calendars + events the suites expect
        # the features suite asserts on the seeded data (e.g. the browser-
        # timezone regression check reads the 12:00 Berlin "Lunch with Sam")
        run: bash scripts/seed-dev.sh

      - name: Build and start the app
        run: |
          trunk build
          python3 scripts/serve.py 3100 dist > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3100/; then break; fi
            sleep 2
          done
          curl -sf -o /dev/null http://127.0.0.1:3100/

      - name: Install e2e dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run e2e suites
        working-directory: e2e
        run: |
          npm test
          node features.mjs
          node recurrence.mjs
          node visibility.mjs
          node fixed-backend.mjs
          node session.mjs
          node location.mjs
          node links.mjs
          node multiday.mjs

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            e2e/login-failure.png
            /tmp/app.log
          if-no-files-found: ignore
