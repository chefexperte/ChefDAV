<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ChefDAV">
  <!-- Flat Adwaita-style app icon: accent-blue tile (12px radius) with a
       white calendar glyph. -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="#3584e4"/>
  <!-- calendar body -->
  <rect x="16" y="20" width="32" height="28" rx="4" fill="none" stroke="#ffffff" stroke-width="4"/>
  <!-- header bar -->
  <rect x="16" y="20" width="32" height="10" rx="4" fill="#ffffff"/>
  <rect x="16" y="26" width="32" height="4" fill="#ffffff"/>
  <!-- binder rings -->
  <rect x="23" y="14" width="4" height="10" rx="2" fill="#ffffff"/>
  <rect x="37" y="14" width="4" height="10" rx="2" fill="#ffffff"/>
  <!-- date dots -->
  <circle cx="24" cy="38" r="2.6" fill="#ffffff"/>
  <circle cx="32" cy="38" r="2.6" fill="#ffffff"/>
  <circle cx="40" cy="38" r="2.6" fill="#ffffff"/>
  <circle cx="24" cy="44" r="2.6" fill="#ffffff"/>
  <circle cx="32" cy="44" r="2.6" fill="#3584e4"/>
</svg>
