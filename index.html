<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="ChefDAV — a client-side-only CalDAV calendar app written in Rust and compiled to WebAssembly." />
    <title>ChefDAV · your calendar</title>
    <link data-trunk rel="icon" href="public/logo.svg" type="image/svg+xml" />
    <!-- Trunk does not copy public/ automatically; declare the logo so the
         login page and sidebar can load /logo.svg. -->
    <link data-trunk rel="copy-file" href="public/logo.svg" />
    <link data-trunk rel="copy-file" href="public/favicon.svg" />
    <!-- design tokens are imported by main.css; copy them so /tokens.css exists -->
    <link data-trunk rel="copy-file" href="style/tokens.css" />
    <!-- Self-hosted fonts (project rule: no third-party CDNs — see AGENTS.md).
         fonts.css is imported by main.css (/fonts.css at runtime), the woff2
         files are served same-origin from /fonts/. -->
    <link data-trunk rel="copy-file" href="style/fonts.css" />
    <link data-trunk rel="copy-dir" href="public/fonts" />
    <!-- build the bin target: on wasm32 its main() mounts the app, natively it
         is the optional static file server for dist/ -->
    <link data-trunk rel="rust" data-target-name="chef-dav" data-cargo-no-default-features="true" />
    <!-- trunk compiles this to dist/main.css and injects the link -->
    <link data-trunk rel="css" href="style/main.css" />
    <!-- Older builds registered a reminder service worker; remove it. -->
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          for (const reg of regs) reg.unregister();
        });
      }
    </script>
  </head>
  <body>
    <!-- Static boot screen: visible while the (dev) WASM bundle downloads and
         compiles, before Rust can render anything. Removed by src/main.rs. -->
    <div id="boot" aria-live="polite">
      <h1>ChefDAV</h1>
      <p>Loading your calendar…</p>
      <div class="bar"><span></span></div>
    </div>
    <style>
      html, body { height: 100%; margin: 0; }
      #boot {
        min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 10px;
        background: #fafafb; color: #2e2e33;
        font-family: system-ui, sans-serif;
      }
      #boot h1 { margin: 0; font-size: 24px; font-weight: 600; }
      #boot p { margin: 0; font-size: 13px; color: #77767b; }
      #boot .bar {
        width: 160px; height: 4px; border-radius: 99px;
        background: rgba(0, 0, 0, 0.08); overflow: hidden;
      }
      #boot .bar span {
        display: block; width: 40%; height: 100%; border-radius: 99px;
        background: #3584e4; animation: boot 1.1s ease-in-out infinite;
      }
      @keyframes boot { from { transform: translateX(-100%); } to { transform: translateX(350%); } }
      @media (prefers-color-scheme: dark) {
        #boot { background: #222226; color: #ffffff; }
        #boot p { color: #c0bfbc; }
        #boot .bar { background: rgba(255, 255, 255, 0.12); }
      }
    </style>
    <!-- trunk injects the wasm-bindgen glue (chef_dav.js + .wasm) here -->
  </body>
</html>
