[package]
name = "caldav"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pure-Rust CalDAV + iCalendar core for ChefDAV (natively unit-testable)"

[dependencies]
aes-gcm = "0.11"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std", "wasmbind"] }
chrono-tz = "0.10"
http = "1"
pbkdf2 = "0.13"
roxmltree = "0.21"
rrule = "0.14"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
thiserror = "2"
url = "2"

[dev-dependencies]
futures = "0.3"
serde_json = "1"
