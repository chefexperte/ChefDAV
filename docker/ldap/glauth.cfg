# glauth fixture for the ChefDAV dev stack (glauth v2.5.4).
# Mounted at /app/config/config.cfg — the image reads exactly that path.
#
# Users (passwords are hex SHA-256, generate with: printf 'pw' | sha256sum):
#   alice    / secret
#   bob      / secret
#   readonly / readonlypass   (service account used by Radicale to search)
#
# glauth builds user DNs as cn=<name>,ou=<primary group name>,<baseDN>, so the
# group "users" below is what makes ou=users,dc=glauth,dc=com exist.

debug = false

[ldap]
  enabled = true
  listen = "0.0.0.0:3893"

[ldaps]
  enabled = false

[backend]
  datastore = "config"
  baseDN = "dc=glauth,dc=com"

[behaviors]
  IgnoreCapabilities = false
  LimitFailedBinds = true
  NumberOfFailedBinds = 10
  PeriodOfFailedBinds = 10
  BlockFailedBindsFor = 30

[[users]]
  name = "alice"
  uidnumber = 5001
  primarygroup = 5500
  passsha256 = "2bb80d537b1da3e38bd30361aa855686bde0eacd7162fef6a25fe97bf527a25b"

[[users]]
  name = "bob"
  uidnumber = 5002
  primarygroup = 5500
  passsha256 = "2bb80d537b1da3e38bd30361aa855686bde0eacd7162fef6a25fe97bf527a25b"

# Service account Radicale binds with to search the directory.
[[users]]
  name = "readonly"
  uidnumber = 5000
  primarygroup = 5500
  passsha256 = "e732cea30de2011edc8065dcedfc6427e8c56eb6768b83684b6bde146142272d"
    [[users.capabilities]]
    action = "search"
    object = "ou=users,dc=glauth,dc=com"
    [[users.capabilities]]
    action = "search"
    object = "ou=groups,dc=glauth,dc=com"

[[groups]]
  name = "users"
  gidnumber = 5500

[[groups]]
  name = "calendar-users"
  gidnumber = 5501
