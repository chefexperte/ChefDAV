name: chefdav

# ChefDAV from the published image (ghcr.io/chefexperte/chefdav) — the static
# calendar app only. Choose the backend **when you start it**, not when it was
# built: the entrypoint turns BACKEND_URL into /srv/config.json on every start.
#
#   1. copy .env.example to .env and set BACKEND_URL (or leave it empty)
#   2. docker compose -f docker/docker-compose.prod.yml up -d
#   3. → http://localhost:8080
#
# Changing BACKEND_URL and running `up -d` again recreates the container with
# the new server — no rebuild, no new image.
#
# Settings (a .env file next to this compose file, same shape as
# ../.env.example for local builds):
#   BACKEND_URL   CalDAV server, e.g. https://dav.example.org
#                 empty/unset → users type the server on the login screen
#   BACKEND_LOCK  true (default when BACKEND_URL is set) → login field is
#                 read-only; false → pre-filled but editable
#   CHEFDAV_PORT  host port                            (default 8080)
#   CHEFDAV_IMAGE image[:tag]     (default ghcr.io/chefexperte/chefdav:latest)
#
# Your CalDAV server must send CORS headers for this origin (see README →
# "Setup"), unless you serve the app from the same host as the CalDAV server.
#
# Behind your own TLS proxy (recommended): point it at this container's port 80
# and delete `ports:` below.

services:
  chefdav:
    image: ${CHEFDAV_IMAGE:-ghcr.io/chefexperte/chefdav:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      # Cache the build by image name, not as an extra local tag.
      tags:
        - ${CHEFDAV_IMAGE:-ghcr.io/chefexperte/chefdav:latest}
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL:-}
      BACKEND_LOCK: ${BACKEND_LOCK:-}
    ports:
      - "${CHEFDAV_PORT:-8080}:80"
    # No persistent state: the calendar data lives in your CalDAV server and
    # the browser cache. A read-only root plus a tmpfs for the per-start
    # /config.json is all the container needs.
    read_only: true
    tmpfs:
      - /srv-runtime
      - /tmp
    security_opt:
      - "no-new-privileges:true"
